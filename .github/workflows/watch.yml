name: Issue watcher

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 min (GitHub may delay runs a few minutes under load)
  workflow_dispatch:             # manual "Run workflow" button
  push:
    paths: [repos.txt]           # editing repos.txt triggers an immediate run

# Never let two runs overwrite each other's state.json
concurrency:
  group: issue-watcher
  cancel-in-progress: false

permissions:
  contents: write                # needed to commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repos and send emails
        run: python repo_watcher.py cloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Save state
        run: |
          git config user.name "issue-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update watcher state" && git push)
